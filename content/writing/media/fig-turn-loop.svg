<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="JetBrains Mono, Menlo, monospace" shape-rendering="geometricPrecision"><defs>
<marker id="figturnloop-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="context-stroke"/></marker>
<pattern id="figturnloop-d" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#f2ae3a"/><rect x="2" y="2" width="2" height="2" fill="#f2ae3a"/></pattern>
<pattern id="figturnloop-db" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2e5bff"/><rect x="2" y="2" width="2" height="2" fill="#2e5bff"/></pattern>
<pattern id="figturnloop-h" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#8a8fa8" opacity=".45"/></pattern>
</defs><rect width="720" height="380" fill="#0b0f24"/><rect x="0" y="0" width="720" height="3" fill="url(#figturnloop-d)" opacity=".9"/><text x="24" y="34" class="m" font-size="12" fill="#f2ae3a" text-anchor="start" letter-spacing="2">EVERY TURN RUNS THROUGH ONE LOOP</text><circle cx="210" cy="212" r="128" fill="none" stroke="#2e5bff" stroke-width="2" stroke-dasharray="6 6"/><path d="M275.8 102.2 A128 128 0 0 1 330.7 169.3" fill="none" stroke="#f2ae3a" stroke-width="3" marker-end="url(#figturnloop-a)"/><path d="M333.0 247.4 A128 128 0 0 1 282.3 317.6" fill="none" stroke="#f2ae3a" stroke-width="3" marker-end="url(#figturnloop-a)"/><path d="M144.2 321.8 A128 128 0 0 1 89.3 254.7" fill="none" stroke="#f2ae3a" stroke-width="3" marker-end="url(#figturnloop-a)"/><path d="M87.0 176.6 A128 128 0 0 1 137.7 106.4" fill="none" stroke="#f2ae3a" stroke-width="3" marker-end="url(#figturnloop-a)"/><rect x="152" y="58" width="116" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="210" y="80" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">Pick up new</text><text x="210" y="97" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">messages</text><rect x="280" y="186" width="116" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="338" y="208" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">Call the</text><text x="338" y="225" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">model</text><rect x="152" y="314" width="116" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="210" y="336" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">Run the tools</text><text x="210" y="353" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">it asked for</text><rect x="24" y="186" width="116" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="82" y="208" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">Fit the</text><text x="82" y="225" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">context</text><text x="210" y="198" class="m" font-size="12.5" fill="#f2ae3a" text-anchor="middle">every change is</text><text x="210" y="215" class="m" font-size="12.5" fill="#f2ae3a" text-anchor="middle">written to the</text><text x="210" y="232" class="m" font-size="12.5" fill="#f2ae3a" text-anchor="middle">stream first</text><rect x="430" y="74" width="266" height="278" fill="#2a0f0c" stroke="#db5a26" stroke-width="2"/><path d="M462 92 L452 116 L462 116 L454 138 L474 110 L464 110 L472 92 Z" fill="#f2ae3a"/><text x="486" y="120" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">If a process dies</text><text x="448" y="166" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">A new one reads the same</text><text x="448" y="185" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">records and ends up in</text><text x="448" y="204" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">exactly the same place.</text><text x="448" y="223" class="s" font-size="13" fill="#d8cdb8" text-anchor="start"></text><text x="448" y="242" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">A tool call is only retried</text><text x="448" y="261" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">if it is safe to run twice.</text><text x="448" y="280" class="s" font-size="13" fill="#d8cdb8" text-anchor="start"></text><text x="448" y="299" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">Stop is written down before</text><text x="448" y="318" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">anything is cancelled.</text></svg>