22" height="22" fill="#f2ae3a"/><text x="404" y="219" class="m" font-size="14" fill="#04050d" text-anchor="middle" font-weight="700">2</text><text x="424" y="219" class="m" font-size="14" fill="#fff0cf" text-anchor="start" font-weight="700">read</text><text x="494" y="219" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">the description</text><rect x="393" y="233" width="22" height="22" fill="#f2ae3a"/><text x="404" y="249" class="m" font-size="14" fill="#04050d" text-anchor="middle" font-weight="700">3</text><text x="424" y="249" class="m" font-size="14" fill="#fff0cf" text-anchor="start" font-weight="700">call</text><text x="494" y="249" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">the right tool</text><text x="380" y="306" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">Small prompts, and the right</text><text x="380" y="325" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">tool is picked more often.</text></svg>