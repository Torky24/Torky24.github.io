<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="JetBrains Mono, Menlo, monospace" shape-rendering="geometricPrecision"><defs>
<marker id="figplatformmap-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="context-stroke"/></marker>
<pattern id="figplatformmap-d" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#f2ae3a"/><rect x="2" y="2" width="2" height="2" fill="#f2ae3a"/></pattern>
<pattern id="figplatformmap-db" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2e5bff"/><rect x="2" y="2" width="2" height="2" fill="#2e5bff"/></pattern>
<pattern id="figplatformmap-h" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#8a8fa8" opacity=".45"/></pattern>
</defs><rect width="720" height="470" fill="#0b0f24"/><rect x="0" y="0" width="720" height="3" fill="url(#figplatformmap-d)" opacity=".9"/><text x="24" y="34" class="m" font-size="12" fill="#f2ae3a" text-anchor="start" letter-spacing="2">ONE WORKSPACE, END TO END</text><rect x="24" y="70" width="152" height="104" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="36" y="98" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">People</text><text x="36" y="120" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">in the web client,</text><text x="36" y="137.55" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">several at once</text><text x="218" y="78" class="m" font-size="12" fill="#8db2ff" text-anchor="start" letter-spacing="2">DURABLE STREAM</text><rect x="218" y="90" width="42" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="239" y="121" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">msg</text><rect x="264" y="90" width="42" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="285" y="121" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">turn</text><rect x="310" y="90" width="42" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="331" y="121" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">tool</text><rect x="356" y="90" width="42" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="377" y="121" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">plan</text><rect x="402" y="90" width="42" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="423" y="121" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">ok?</text><rect x="448" y="90" width="42" height="52" fill="#2a0f0c" stroke="#f2ae3a" stroke-width="1.5"/><text x="469" y="121" class="m" font-size="12" fill="#f2ae3a" text-anchor="middle">msg</text><path d="M218 160 L490 160" fill="none" stroke="#8a8fa8" stroke-width="1.5" marker-end="url(#figplatformmap-a)"/><text x="218" y="180" class="m" font-size="12" fill="#8a8fa8" text-anchor="start">append-only, one per workspace</text><rect x="548" y="70" width="148" height="104" fill="#2a0f0c" stroke="#f2ae3a" stroke-width="2"/><rect x="548" y="70" width="148" height="5" fill="url(#figplatformmap-d)"/><text x="560" y="98" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">Turn loop</text><text x="560" y="120" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">run by a supervisor</text><text x="560" y="137.55" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">that holds a lease</text><path d="M176 104 L214 104" fill="none" stroke="#f2ae3a" stroke-width="2" marker-end="url(#figplatformmap-a)"/><rect x="184" y="73" width="22" height="22" fill="#f2ae3a"/><text x="195" y="89" class="m" font-size="14" fill="#04050d" text-anchor="middle" font-weight="700">1</text><path d="M214 154 L182 154" fill="none" stroke="#8db2ff" stroke-width="2" marker-end="url(#figplatformmap-a)"/><rect x="184" y="185" width="22" height="22" fill="#f2ae3a"/><text x="195" y="201" class="m" font-size="14" fill="#04050d" text-anchor="middle" font-weight="700">5</text><path d="M498 104 L544 104" fill="none" stroke="#f2ae3a" stroke-width="2" marker-end="url(#figplatformmap-a)"/><rect x="510" y="73" width="22" height="22" fill="#f2ae3a"/><text x="521" y="89" class="m" font-size="14" fill="#04050d" text-anchor="middle" font-weight="700">2</text><path d="M548 150 L502 150" fill="none" stroke="#f2ae3a" stroke-width="2" marker-end="url(#figplatformmap-a)"/><rect x="514" y="181" width="22" height="22" fill="#f2ae3a"/><text x="525" y="197" class="m" font-size="14" fill="#04050d" text-anchor="middle" font-weight="700">4</text><rect x="218" y="270" width="156" height="92" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="230" y="298" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">Read model</text><text x="230" y="320" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">Postgres, rebuilt</text><text x="230" y="337.55" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">from the stream</text><path d="M296 194 L296 266" fill="none" stroke="#8db2ff" stroke-width="2" marker-end="url(#figplatformmap-a)"/><rect x="394" y="270" width="140" height="92" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="406" y="298" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">Models</text><text x="406" y="320" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">several providers,</text><text x="406" y="337.55" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">three clouds</text><rect x="554" y="270" width="142" height="92" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="566" y="298" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">Permission</text><text x="566" y="320" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">checked on</text><text x="566" y="337.55" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">every tool call</text><rect x="554" y="384" width="142" height="66" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="566" y="412" class="s" font-size="16" fill="#fff0cf" text-anchor="start" font-weight="700">Sandbox</text><text x="566" y="434" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">microVM per agent</text><path d="M600 174 L600 220 L464 220 L464 266" fill="none" stroke="#f2ae3a" stroke-width="2" marker-end="url(#figplatformmap-a)"/><path d="M650 174 L650 266" fill="none" stroke="#f2ae3a" stroke-width="2" marker-end="url(#figplatformmap-a)"/><path d="M625 362 L625 380" fill="none" stroke="#f2ae3a" stroke-width="2" marker-end="url(#figplatformmap-a)"/><rect x="614" y="209" width="22" height="22" fill="#f2ae3a"/><text x="625" y="225" class="m" font-size="14" fill="#04050d" text-anchor="middle" font-weight="700">3</text><text x="24" y="410" class="s" font-size="12.5" fill="#d8cdb8" text-anchor="start">Nothing important lives only</text><text x="24" y="428" class="s" font-size="12.5" fill="#d8cdb8" text-anchor="start">in a process. If one dies,</text><text x="24" y="446" class="s" font-size="12.5" fill="#d8cdb8" text-anchor="start">another picks the workspace up</text><text x="24" y="464" class="s" font-size="12.5" fill="#d8cdb8" text-anchor="start">from the stream.</text></svg>