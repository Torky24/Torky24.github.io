<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="JetBrains Mono, Menlo, monospace" shape-rendering="geometricPrecision"><defs>
<marker id="figpermissioncheck-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="context-stroke"/></marker>
<pattern id="figpermissioncheck-d" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#f2ae3a"/><rect x="2" y="2" width="2" height="2" fill="#f2ae3a"/></pattern>
<pattern id="figpermissioncheck-db" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2e5bff"/><rect x="2" y="2" width="2" height="2" fill="#2e5bff"/></pattern>
<pattern id="figpermissioncheck-h" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#8a8fa8" opacity=".45"/></pattern>
</defs><rect width="720" height="330" fill="#0b0f24"/><rect x="0" y="0" width="720" height="3" fill="url(#figpermissioncheck-d)" opacity=".9"/><text x="24" y="34" class="m" font-size="12" fill="#f2ae3a" text-anchor="start" letter-spacing="2">EVERY TOOL CALL IS CHECKED TWICE</text><rect x="24" y="70" width="150" height="78" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="36" y="98" class="s" font-size="16" fill="#fff0cf" text-anchor="start" font-weight="700">Agent wants</text><text x="36" y="120" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">to call a tool</text><path d="M290 59 L372 109 L290 159 L208 109 Z" fill="#0a1240" stroke="#f2ae3a" stroke-width="2"/><text x="290" y="105" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">Is there a grant</text><text x="290" y="122" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">that covers it?</text><path d="M506 59 L588 109 L506 159 L424 109 Z" fill="#0a1240" stroke="#f2ae3a" stroke-width="2"/><text x="506" y="105" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">Is the person</text><text x="506" y="122" class="s" font-size="13" fill="#fff0cf" text-anchor="middle" font-weight="600">still allowed?</text><path d="M174 109 L204 109" fill="none" stroke="#8db2ff" stroke-width="2" marker-end="url(#figpermissioncheck-a)"/><path d="M372 109 L420 109" fill="none" stroke="#22b36b" stroke-width="2" marker-end="url(#figpermissioncheck-a)"/><text x="396" y="100" class="m" font-size="12" fill="#22b36b" text-anchor="middle">yes</text><path d="M588 109 L614 109" fill="none" stroke="#22b36b" stroke-width="2" marker-end="url(#figpermissioncheck-a)"/><text x="600" y="96" class="m" font-size="12" fill="#22b36b" text-anchor="middle">yes</text><rect x="618" y="80" width="90" height="58" fill="#0a1240" stroke="#22b36b" stroke-width="2"/><text x="628" y="104" class="s" font-size="13" fill="#fff0cf" text-anchor="start" font-weight="700">Run it,</text><text x="628" y="121" class="s" font-size="13" fill="#fff0cf" text-anchor="start" font-weight="700">record it</text><path d="M290 159 L290 214" fill="none" stroke="#f2ae3a" stroke-width="2" marker-end="url(#figpermissioncheck-a)"/><text x="300" y="192" class="m" font-size="12" fill="#f2ae3a" text-anchor="start">no</text><rect x="178" y="218" width="224" height="92" fill="#2a0f0c" stroke="#f2ae3a" stroke-width="2"/><text x="192" y="244" class="s" font-size="16" fill="#fff0cf" text-anchor="start" font-weight="700">Ask the person</text><text x="192" y="266" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">allow once, always, or no.</text><text x="192" y="283" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">A one-time yes is handed</text><text x="192" y="300" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">back if the call never ran.</text><path d="M506 159 L506 214" fill="none" stroke="#db5a26" stroke-width="2" marker-end="url(#figpermissioncheck-a)"/><text x="516" y="192" class="m" font-size="12" fill="#db5a26" text-anchor="start">no</text><rect x="430" y="218" width="152" height="92" fill="#04050d" stroke="#db5a26" stroke-width="2"/><text x="444" y="244" class="s" font-size="16" fill="#fff0cf" text-anchor="start" font-weight="700">Refuse</text><text x="444" y="266" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">Fails closed,</text><text x="444" y="283" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">and keeps a record.</text><text x="612" y="178" class="s" font-size="12" fill="#d8cdb8" text-anchor="start">Agents never</text><text x="612" y="195" class="s" font-size="12" fill="#d8cdb8" text-anchor="start">hold credentials.</text><text x="612" y="212" class="s" font-size="12" fill="#d8cdb8" text-anchor="start">They can never</text><text x="612" y="229" class="s" font-size="12" fill="#d8cdb8" text-anchor="start">do more than</text><text x="612" y="246" class="s" font-size="12" fill="#d8cdb8" text-anchor="start">the person they</text><text x="612" y="263" class="s" font-size="12" fill="#d8cdb8" text-anchor="start">work for.</text></svg>