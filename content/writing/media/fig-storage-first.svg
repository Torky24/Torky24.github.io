<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="JetBrains Mono, Menlo, monospace" shape-rendering="geometricPrecision"><defs>
<marker id="figstoragefirst-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="context-stroke"/></marker>
<pattern id="figstoragefirst-d" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#f2ae3a"/><rect x="2" y="2" width="2" height="2" fill="#f2ae3a"/></pattern>
<pattern id="figstoragefirst-db" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2e5bff"/><rect x="2" y="2" width="2" height="2" fill="#2e5bff"/></pattern>
<pattern id="figstoragefirst-h" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#8a8fa8" opacity=".45"/></pattern>
</defs><rect width="720" height="340" fill="#0b0f24"/><rect x="0" y="0" width="720" height="3" fill="url(#figstoragefirst-d)" opacity=".9"/><text x="24" y="34" class="m" font-size="12" fill="#f2ae3a" text-anchor="start" letter-spacing="2">WHERE THE STATE LIVES</text><text x="24" y="72" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">State on the machines</text><rect x="24" y="90" width="94" height="110" fill="#0a1240" stroke="#8a8fa8" stroke-width="1.5"/><text x="71" y="116" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">service</text><rect x="38" y="136" width="66" height="48" fill="#2a0f0c" stroke="#db5a26" stroke-width="1.5"/><text x="71" y="165" class="m" font-size="12" fill="#db5a26" text-anchor="middle">disk</text><rect x="130" y="90" width="94" height="110" fill="#0a1240" stroke="#8a8fa8" stroke-width="1.5"/><text x="177" y="116" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">service</text><rect x="144" y="136" width="66" height="48" fill="#2a0f0c" stroke="#db5a26" stroke-width="1.5"/><text x="177" y="165" class="m" font-size="12" fill="#db5a26" text-anchor="middle">disk</text><rect x="236" y="90" width="94" height="110" fill="#0a1240" stroke="#8a8fa8" stroke-width="1.5"/><text x="283" y="116" class="m" font-size="12" fill="#d8cdb8" text-anchor="middle">service</text><rect x="250" y="136" width="66" height="48" fill="#2a0f0c" stroke="#db5a26" stroke-width="1.5"/><text x="283" y="165" class="m" font-size="12" fill="#db5a26" text-anchor="middle">disk</text><text x="24" y="252" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">Scaling means moving data,</text><text x="24" y="271" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">rebalancing and looking after disks.</text><text x="24" y="290" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">A crash can take state with it.</text><text x="380" y="72" class="s" font-size="17" fill="#fff0cf" text-anchor="start" font-weight="700">Storage first</text><rect x="380" y="90" width="56" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="408" y="121" class="m" font-size="9.5" fill="#d8cdb8" text-anchor="middle">stateless</text><path d="M408 142 L408 166" fill="none" stroke="#f2ae3a" stroke-width="1.5" marker-end="url(#figstoragefirst-a)"/><rect x="444" y="90" width="56" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="472" y="121" class="m" font-size="9.5" fill="#d8cdb8" text-anchor="middle">stateless</text><path d="M472 142 L472 166" fill="none" stroke="#f2ae3a" stroke-width="1.5" marker-end="url(#figstoragefirst-a)"/><rect x="508" y="90" width="56" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="536" y="121" class="m" font-size="9.5" fill="#d8cdb8" text-anchor="middle">stateless</text><path d="M536 142 L536 166" fill="none" stroke="#f2ae3a" stroke-width="1.5" marker-end="url(#figstoragefirst-a)"/><rect x="572" y="90" width="56" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="600" y="121" class="m" font-size="9.5" fill="#d8cdb8" text-anchor="middle">stateless</text><path d="M600 142 L600 166" fill="none" stroke="#f2ae3a" stroke-width="1.5" marker-end="url(#figstoragefirst-a)"/><rect x="636" y="90" width="56" height="52" fill="#0a1240" stroke="#2e5bff" stroke-width="1.5"/><text x="664" y="121" class="m" font-size="9.5" fill="#d8cdb8" text-anchor="middle">stateless</text><path d="M664 142 L664 166" fill="none" stroke="#f2ae3a" stroke-width="1.5" marker-end="url(#figstoragefirst-a)"/><rect x="380" y="170" width="312" height="46" fill="#2a0f0c" stroke="#f2ae3a" stroke-width="2"/><rect x="380" y="170" width="312" height="5" fill="url(#figstoragefirst-d)"/><text x="536" y="199" class="m" font-size="13" fill="#f2ae3a" text-anchor="middle" font-weight="700">object storage holds the state</text><text x="380" y="252" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">Any machine can pick up any work.</text><text x="380" y="271" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">More capacity is just more containers,</text><text x="380" y="290" class="s" font-size="13" fill="#d8cdb8" text-anchor="start">and a crash loses nothing.</text></svg>