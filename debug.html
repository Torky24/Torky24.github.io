<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World debug — scrub the camera</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04050d; color: #fff0cf; font: 14px/1.4 monospace; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
      .ui { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; background: #04050dcc; padding: 8px 12px; }
      input { flex: 1; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="ui"><span>u</span><input id="u" type="range" min="0" max="10" step="0.01" value="0" /><span id="v">0</span></div>
    <script type="module">
      import { createWorld } from './src/world/world.ts';
      import { SHOTS } from './src/world/timeline.ts';
      const q = new URLSearchParams(location.search);
      const w = createWorld(document.getElementById('c'), q.get('tier') || 'high');
      window.__world = w;
      const s = document.getElementById('u'), v = document.getElementById('v');
      s.max = String(SHOTS.length - 1);
      const set = () => { w.setTarget(+s.value); v.textContent = (+s.value).toFixed(2) + ' ' + SHOTS[Math.floor(+s.value)].name; };
      s.oninput = set;
      if (q.get('u')) { s.value = q.get('u'); set(); w.snap(); }
      addEventListener('resize', () => w.resize());
      if (!q.has('static')) w.start();
    </script>
  </body>
</html>
